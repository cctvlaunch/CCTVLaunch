<section class="cid-uQPNjKSrs7" id="custom-html-fl">

   <!-- HTML for Mobirise Calculator -->
<div class="calc-wrapper">


  <!-- Input Rows -->
  <div class="calc-row">
    <div class="calc-field">
      <label>Ad Spend (Monthly)</label>
      <input type="number" id="adSpend">
    </div>
    <div class="calc-field">
      <label>Total Leads</label>
      <input type="number" id="totalLeads">
    </div>
  </div>
  <div class="calc-row">

    <div class="calc-field">
      <label>Average Invoice</label>
      <input type="number" id="avgInvoice">
    </div>
    <div class="calc-field">
      <label>Agency Charge (Monthly)</label>
      <input type="number" id="agencyCharge">
    </div>
  </div>
  <div class="calc-row">
    <div class="calc-field">
      <label>Close Rate (%)</label>
      <input type="number" id="closeRate">
    </div>
    <div class="calc-field">
      <label>Jobs Closed</label>
      <input type="number" id="jobsClosed" class="readonly" readonly="">
    </div>
  </div>

  <!-- Output Rows -->
  <div class="calc-row">
    <div class="calc-field">
      <label>CPL (Cost Per Lead)</label>
      <input type="number" id="cpl" class="readonly" readonly="">
    </div>
    <div class="calc-field">
      <label>CPA (Cost Per Acquisition)</label>
      <input type="number" id="cpa" class="readonly" readonly="">
    </div>
  </div>

  <!-- Monthly / Yearly Revenue Section -->
  <div class="calc-split">
    <div class="calc-box">
      <div class="calc-subfield">
        <div class="calc-heading">Monthly</div>
        <label>Revenue</label>
        <input type="number" id="monthlyRevenue" class="readonly" readonly="">
        <label>Agency Charge</label>
        <input type="number" id="monthlyAgency" class="readonly" readonly="">
      </div>
    </div>
    <div class="calc-box">
      <div class="calc-subfield">
        <div class="calc-heading">Yearly</div>
        <label>Revenue</label>
        <input type="number" id="yearlyRevenue" class="readonly" readonly="">
        <label>Agency Charge</label>
        <input type="number" id="yearlyAgency" class="readonly" readonly="">
      </div>
    </div>
  </div>

  <!-- Summary -->
  <div class="calc-summary" id="summaryText"></div>
</div>

<!-- JS to Make It Work -->
<script>
  function calculate() {
    const adSpend = parseFloat(document.getElementById('adSpend').value);
    const totalLeads = parseFloat(document.getElementById('totalLeads').value);
    const avgInvoice = parseFloat(document.getElementById('avgInvoice').value);
    const agencyCharge = parseFloat(document.getElementById('agencyCharge').value);
    const closeRatePercent = parseFloat(document.getElementById('closeRate').value);

    if (isNaN(adSpend) || isNaN(totalLeads) || isNaN(avgInvoice) || isNaN(agencyCharge) || isNaN(closeRatePercent)) {
      document.getElementById('summaryText').innerHTML = '';
      return;
    }

    const closeRate = closeRatePercent / 100;
    const jobsClosed = totalLeads * closeRate;
    const cpl = adSpend / totalLeads;
    const cpa = jobsClosed > 0 ? adSpend / jobsClosed : 0;
    const revenue = jobsClosed * avgInvoice;
    const yearlyRevenue = revenue * 12;
    const yearlyAgency = agencyCharge * 12;
    const roi = (adSpend * 12) > 0 ? (yearlyRevenue / (adSpend * 12)) : 0;

    document.getElementById('jobsClosed').value = jobsClosed.toFixed(0);
    document.getElementById('cpl').value = cpl.toFixed(2);
    document.getElementById('cpa').value = cpa.toFixed(2);
    document.getElementById('monthlyRevenue').value = revenue.toFixed(2);
    document.getElementById('monthlyAgency').value = agencyCharge.toFixed(2);
    document.getElementById('yearlyRevenue').value = yearlyRevenue.toFixed(2);
    document.getElementById('yearlyAgency').value = yearlyAgency.toFixed(2);

    document.getElementById('summaryText').innerHTML = `
      By investing <strong>${adSpend.toFixed(2)}</strong>/month, you can potentially add <strong>${yearlyRevenue.toFixed(2)}</strong>/year.<br>
      Your ROI is <strong>${roi.toFixed(2)}x</strong>.
    `;
  }

  document.querySelectorAll('input').forEach(input => input.addEventListener('input', calculate));
</script>
